<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Trigger Track GIF</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>Trigger Track GIF</strong>
      <span id="badge" class="badge">трек</span>
      <span id="version" class="version"></span>
    </header>

    <p id="hint" class="hint">Трек → YouTube → кроп. Всё в этом окне.</p>

    <div id="state" class="state loading">Читаю трек с Trigger…</div>

    <div id="card" class="card hidden">
      <img id="cover" alt="" width="64" height="64" />
      <div class="meta">
        <div id="title" class="title"></div>
        <div id="artist" class="artist"></div>
        <div id="source" class="source"></div>
      </div>
    </div>

    <div id="ytBlock" class="yt-block hidden">
      <div class="yt-heading">YouTube</div>
      <div id="ytState" class="yt-state"></div>
      <div id="ytList" class="yt-list"></div>
    </div>

    <div id="cropBlock" class="crop-block hidden">
      <div class="yt-heading">Кроп</div>
      <div class="crop-meta tight-meta">
        <div id="cropTitle" class="crop-title"></div>
        <div id="cropChannel" class="crop-channel"></div>
      </div>
      <div class="player-wrap">
        <iframe
          id="ytPlayer"
          title="YouTube"
          allow="autoplay; encrypted-media"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
        <div id="loopBadge" class="loop-badge hidden">луп = твоя гифка</div>
      </div>
      <p id="playerNote" class="crop-note hidden"></p>
      <div id="clipSlider"></div>
      <p class="hint tight">Тяни начало и конец. В окне по кругу крутится ровно то, что будет в гифке (макс 6 сек). Полоска сверху — где в песне.</p>
      <div class="crop-actions">
        <button id="previewCrop" type="button">Превью на YouTube</button>
        <button id="saveCrop" type="button" class="primary">Сделать гифку</button>
        <button id="backToList" type="button" class="ghost">← другой ролик</button>
      </div>
      <p id="cropSaved" class="picked hidden"></p>
    </div>

    <div id="gifBlock" class="crop-block hidden">
      <div class="yt-heading">Гифка</div>
      <div id="gifState" class="state"></div>
      <img id="gifImg" class="gif-img hidden" alt="" />
      <div id="gifInfo" class="source"></div>
      <div id="gifActions" class="crop-actions hidden">
        <button id="uploadGif" type="button" class="primary">Залить и вставить в чат</button>
        <button id="downloadGif" type="button">Скачать .gif</button>
        <button id="redoCrop" type="button" class="ghost">← поменять отрезок</button>
      </div>
      <p id="gifLink" class="picked hidden"></p>
      <button id="newGif" type="button" class="ghost-wide hidden">Новая гифка</button>
    </div>

    <button id="refresh" type="button">Обновить трек</button>

    <script src="youtube-search.js"></script>
    <script src="crop-player.js"></script>
    <script src="clip-slider.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
