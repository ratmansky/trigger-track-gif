<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Кроп — Trigger Track GIF</title>
    <link rel="stylesheet" href="crop.css" />
  </head>
  <body>
    <header>
      <div>
        <strong>Кроп клипа</strong>
        <span class="badge">этап D</span>
      </div>
      <button id="back" type="button" class="linkish">Закрыть</button>
    </header>

    <p id="trackLine" class="track-line"></p>
    <p id="videoLine" class="video-line"></p>

    <div id="state" class="state">Загружаю…</div>

    <div id="stage" class="stage hidden">
      <div class="player-wrap">
        <iframe
          id="player"
          title="YouTube preview"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>

      <div class="controls">
        <label class="field">
          <span>Начало (сек)</span>
          <input id="startSec" type="number" min="0" step="0.5" value="0" />
        </label>
        <label class="field">
          <span>Длина клипа (сек)</span>
          <input id="durationSec" type="number" min="1" max="8" step="0.5" value="3" />
        </label>
        <p class="hint">Для гифки лучше 2–6 секунд. Максимум сейчас — 8.</p>

        <div class="actions">
          <button id="preview" type="button">Превью отрезка</button>
          <button id="save" type="button" class="primary">Ок, этот отрезок</button>
        </div>

        <p id="saved" class="saved hidden"></p>
        <p class="next-note">
          Следом: вырежем файл и зальём на Giphy. Пока сохраняем только таймкод.
        </p>
      </div>
    </div>

    <script src="crop.js"></script>
  </body>
</html>
